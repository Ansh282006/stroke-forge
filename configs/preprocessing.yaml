resize:
  width: 512
  height: 512
  keep_aspect: true

grayscale:
  enabled: true

denoise:
  method: bilateral
  d: 9
  sigma_color: 75
  sigma_space: 75

contrast:
  method: clahe
  clip_limit: 2.0
  tile_grid: [8, 8]

threshold:
  method: otsu

edges:
  method: canny
  low: 60
  high: 160

morphology:
  close_kernel: 3
  close_iter: 1

skeleton:
  enabled: true

contours:
  mode: RETR_LIST
  method: CHAIN_APPROX_SIMPLE
  min_area: 25.0