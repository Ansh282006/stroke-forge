[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    animation: marks tests that exercise the animation engine (M5)
    slow: marks end-to-end tests that touch disk or the CLI
    ml: marks tests that require torch or a trained model
    api: marks tests that exercise the FastAPI backend