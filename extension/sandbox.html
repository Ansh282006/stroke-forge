<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>StrokeForge sandbox</title>
    <style>html,body{margin:0;background:#05060a;color:#e7e9ee;font-family:system-ui}iframe{border:0;width:100vw;height:100vh}</style>
  </head>
  <body>
    <iframe id="frame" sandbox="allow-scripts"></iframe>
    <script>
      // M8: receives the backend-served index.html URL and shows it inside
      // a sandboxed iframe. allow-scripts is required for the generated
      // animation; allow-same-origin is deliberately omitted so the
      // generated page cannot touch extension APIs.
      window.addEventListener("message", (ev) => {
        if (!ev.data || ev.data.type !== "sf:load") return;
        document.getElementById("frame").src = String(ev.data.url || "");
      });
    </script>
  </body>
</html>
