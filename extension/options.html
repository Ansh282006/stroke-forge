<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>StrokeForge Options</title>
    <style>body{font-family:system-ui;background:#05060a;color:#e7e9ee;padding:20px}
    input,button{padding:8px;border-radius:8px;border:1px solid #ffffff22;background:#ffffff10;color:inherit}
    button{background:#00f0ff;color:#000;font-weight:600;border:none;cursor:pointer}</style>
  </head>
  <body>
    <h1>StrokeForge options</h1>
    <label>Backend URL <input id="url" style="width:320px" /></label>
    <button id="save">Save</button>
    <script>
      const url = document.getElementById("url");
      chrome.storage.local.get("backendUrl").then((r) => { url.value = r.backendUrl || ""; });
      document.getElementById("save").addEventListener("click", () => {
        chrome.storage.local.set({ backendUrl: url.value });
      });
    </script>
  </body>
</html>
